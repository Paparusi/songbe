# Tests on every push and pull request. While the repository is private the automatic runs are skipped (they would spend paid
# minutes); they start by themselves the day it is made public. A run can also be started by hand for one system.
name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      os: { description: 'Which system', type: choice, options: [ubuntu-latest, windows-latest, macos-latest], default: ubuntu-latest }
jobs:
  test:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.os)) || fromJSON('["ubuntu-latest","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      # the drawing tests need ffmpeg and a browser; the runners have Chrome (and Edge on Windows) already
      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: node bin/songbe.mjs setup ffmpeg
      - run: node bin/songbe.mjs doctor
      - run: npm test
