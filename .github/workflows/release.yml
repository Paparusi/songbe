# Installers for a tagged release: a setup program for Windows, an AppImage and a .deb for Linux, a disk image for macOS, attached
# to the GitHub release of that tag. Each is installed and started on the runner first (app/smoke.mjs); one that does not come up
# is never attached. Skipped while the repository is private (macOS minutes cost ten times the others); it can be started by hand
# from the Actions tab for one system at a time. Nothing is code-signed.
name: release
on:
  push: { tags: ['v*'] }
  workflow_dispatch:
    inputs:
      os: { description: 'Which system', type: choice, options: [ubuntu-22.04, windows-latest, macos-latest], default: ubuntu-22.04 }
env:
  TAURI_CLI: 2.12.1      # the Tauri command the installers are made with: compiled once per system (ten minutes), then kept
jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    permissions: { contents: write }
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.os)) || fromJSON('["ubuntu-22.04","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Libraries the window needs (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf xvfb dbus
      - uses: actions/cache@v6
        id: tauri
        with:
          path: ~/.cargo/bin/cargo-tauri${{ runner.os == 'Windows' && '.exe' || '' }}
          key: cargo-tauri-${{ env.TAURI_CLI }}-${{ matrix.os }}-${{ runner.arch }}
      - name: The Tauri command
        if: steps.tauri.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version ${{ env.TAURI_CLI }} --locked
      - run: node app/build.mjs
      # install what was made the way a person would, start it, and see that it works
      - name: Try it (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./app/src-tauri/target/*/release/bundle/deb/*.deb
          songbe doctor
          dbus-run-session -- xvfb-run -a node app/smoke.mjs /usr/bin/songbe
          dbus-run-session -- xvfb-run -a node app/smoke.mjs app/src-tauri/target/*/release/bundle/appimage/*.AppImage
      - name: Try it (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem app/src-tauri/target/*/release/bundle/nsis/*.exe)[0].FullName
          Start-Process $setup -ArgumentList '/S' -Wait
          $dir = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Songbe').InstallLocation.Trim('"')
          node app/smoke.mjs "$dir\songbe.exe"
      - name: Try it (macOS)
        if: runner.os == 'macOS'
        run: node app/smoke.mjs app/src-tauri/target/*/release/bundle/macos/Songbe.app/Contents/MacOS/songbe
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            app/src-tauri/target/*/release/bundle/nsis/*.exe
            app/src-tauri/target/*/release/bundle/appimage/*.AppImage
            app/src-tauri/target/*/release/bundle/deb/*.deb
            app/src-tauri/target/*/release/bundle/dmg/*.dmg
      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: songbe-${{ runner.os }}
          path: |
            app/src-tauri/target/*/release/bundle/nsis/*.exe
            app/src-tauri/target/*/release/bundle/appimage/*.AppImage
            app/src-tauri/target/*/release/bundle/deb/*.deb
            app/src-tauri/target/*/release/bundle/dmg/*.dmg
