# Installers for a tagged release: a setup program for Windows, an AppImage and a .deb for Linux, a disk image for macOS.
# Each is installed and started on its runner (app/smoke.mjs). Only when all of them came up is the release made, with their
# checksums and notes; one that does not start is never published. Started by hand from the Actions tab it builds and checks
# one system, or with "all" every system plus a rehearsal of publishing that stops short of the release itself.
# In a private copy of the repository tagged runs are skipped (macOS minutes cost ten times the others).
#
# Signing: the macOS app is signed and checked by Apple when the repository holds a Developer ID (five secrets, see app/README.md).
# That happens in a job of its own, on a machine that compiled nothing: it receives the finished app and runs Apple's tools and
# app/mac.mjs, so the identity is never near other people's build scripts. Windows is not code-signed.
# No action from outside GitHub's own is used here.
name: release
on:
  push: { tags: ['v*'] }
  workflow_dispatch:
    inputs:
      os: { description: 'Which system (all: every one, and a rehearsal of publishing)', type: choice, options: [ubuntu-22.04, windows-latest, macos-latest, all], default: ubuntu-22.04 }
env:
  TAURI_CLI: 2.12.1      # the Tauri command the installers are made with: compiled once per system (ten minutes), then kept
jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    permissions: { contents: read }
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'workflow_dispatch' && inputs.os != 'all') && fromJSON(format('["{0}"]', inputs.os)) || fromJSON('["ubuntu-22.04","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Rust
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - name: Libraries the window needs (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf xvfb dbus
      - uses: actions/cache/restore@v6
        id: tauri
        with:
          path: ~/.cargo/bin/cargo-tauri${{ runner.os == 'Windows' && '.exe' || '' }}
          key: cargo-tauri-${{ env.TAURI_CLI }}-${{ matrix.os }}-${{ runner.arch }}
      - name: The Tauri command
        if: steps.tauri.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version ${{ env.TAURI_CLI }} --locked
      - uses: actions/cache/save@v6      # kept at once, whatever happens to the rest of the run
        if: steps.tauri.outputs.cache-hit != 'true'
        with:
          path: ~/.cargo/bin/cargo-tauri${{ runner.os == 'Windows' && '.exe' || '' }}
          key: cargo-tauri-${{ env.TAURI_CLI }}-${{ matrix.os }}-${{ runner.arch }}
      - run: node app/build.mjs
      # install what was made the way a person would, start it, and see that it works
      - name: Try it (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./app/src-tauri/target/*/release/bundle/deb/*.deb
          songbe doctor
          dbus-run-session -- xvfb-run -a node app/smoke.mjs /usr/bin/songbe
          dbus-run-session -- xvfb-run -a node app/smoke.mjs app/src-tauri/target/*/release/bundle/appimage/*.AppImage
      - name: Try it (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem app/src-tauri/target/*/release/bundle/nsis/*.exe)[0].FullName
          Start-Process $setup -ArgumentList '/S' -Wait
          $dir = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Songbe').InstallLocation.Trim('"')
          node bin/songbe.mjs setup ffmpeg      # what the app's own button does: the installed app must then find it
          node app/smoke.mjs "$dir\songbe.exe"
      - uses: actions/upload-artifact@v7
        if: runner.os != 'macOS'
        with:
          name: songbe-${{ runner.os }}
          path: |
            app/src-tauri/target/*/release/bundle/nsis/*.exe
            app/src-tauri/target/*/release/bundle/appimage/*.AppImage
            app/src-tauri/target/*/release/bundle/deb/*.deb
      # macOS: the finished app goes to the job below, which signs it (when it can), makes the disk image and tries it
      - name: Hand the app over (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent app/src-tauri/target/*/release/bundle/macos/Songbe.app "$RUNNER_TEMP/Songbe.app.zip"
      - uses: actions/upload-artifact@v7
        if: runner.os == 'macOS'
        with: { name: unsigned-macOS-app, path: '${{ runner.temp }}/Songbe.app.zip', retention-days: 1 }

  # A machine that compiled nothing: it unpacks the app, signs it and has Apple check it when the repository holds a Developer ID,
  # makes the disk image, and starts the app out of that image.
  mac:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.os == 'macos-latest' || inputs.os == 'all' }}
    runs-on: macos-latest
    permissions: { contents: read }
    env:
      HAVE_APPLE: ${{ vars.SIGN_MACOS != 'false' && secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_API_KEY_P8 != '' }}      # the repository variable SIGN_MACOS=false holds signing back without touching the secrets
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: actions/download-artifact@v8
        with: { name: unsigned-macOS-app, path: '${{ runner.temp }}' }
      - name: Unpack the app
        run: |
          to="app/src-tauri/target/$([ "$(uname -m)" = arm64 ] && echo aarch64 || echo x86_64)-apple-darwin/release/bundle/macos"
          mkdir -p "$to" && ditto -x -k "$RUNNER_TEMP/Songbe.app.zip" "$to" && ls "$to"
      - name: Disk image, unsigned
        if: env.HAVE_APPLE != 'true'
        run: node app/mac.mjs
      # The Developer ID is taken out of the secrets only here, into a keychain of its own that is thrown away afterwards.
      - name: Sign, have Apple check, disk image
        if: env.HAVE_APPLE == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          chain="$RUNNER_TEMP/songbe-signing.keychain-db"; pass="$(openssl rand -hex 24)"
          security create-keychain -p "$pass" "$chain"
          security set-keychain-settings -lut 3600 "$chain"
          security unlock-keychain -p "$pass" "$chain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/identity.p12"
          security import "$RUNNER_TEMP/identity.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -f pkcs12 -k "$chain" -T /usr/bin/codesign > /dev/null
          rm "$RUNNER_TEMP/identity.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$chain" > /dev/null
          security list-keychains -d user -s "$chain" $(security list-keychains -d user | tr -d '"')
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/notary.p8"
          export APPLE_SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$chain" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          test -n "$APPLE_SIGNING_IDENTITY" || { echo "no Developer ID Application identity in APPLE_CERTIFICATE"; exit 1; }
          node app/mac.mjs
          security delete-keychain "$chain"; rm "$RUNNER_TEMP/notary.p8"
      - name: Try it (macOS)
        run: |
          hdiutil attach app/src-tauri/target/*/release/bundle/dmg/*.dmg -nobrowse -readonly -mountpoint "$RUNNER_TEMP/songbe-image" > /dev/null
          ls -la "$RUNNER_TEMP/songbe-image"
          mkdir -p "$RUNNER_TEMP/Applications" && ditto "$RUNNER_TEMP/songbe-image/Songbe.app" "$RUNNER_TEMP/Applications/Songbe.app"
          hdiutil detach "$RUNNER_TEMP/songbe-image" > /dev/null
          cat app/src-tauri/target/*/release/bundle/dmg/macos-signing.txt
          node app/smoke.mjs "$RUNNER_TEMP/Applications/Songbe.app/Contents/MacOS/songbe"
      - uses: actions/upload-artifact@v7
        with:
          name: songbe-macOS
          path: |
            app/src-tauri/target/*/release/bundle/dmg/*.dmg
            app/src-tauri/target/*/release/bundle/dmg/macos-signing.txt

  # Every system built and started: gather the installers, write their checksums and the notes, and make the release.
  publish:
    needs: [build, mac]
    if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.os == 'all') }}
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: actions/download-artifact@v8
        with: { path: got, pattern: 'songbe-*', merge-multiple: true }
      - name: Checksums and notes
        run: |
          mkdir out && find got -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' -o -name 'macos-signing.txt' \) -exec mv {} out/ \;
          (cd out && sha256sum *.exe *.dmg *.deb *.AppImage > SHA256SUMS.txt && cat SHA256SUMS.txt)
          node app/notes.mjs out > notes.md && cat notes.md
          rm out/macos-signing.txt
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = "v$(node bin/songbe.mjs --version)" || { echo "the tag $GITHUB_REF_NAME is not the version in package.json"; exit 1; }
          gh release create "$GITHUB_REF_NAME" out/* --title "Songbe ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
