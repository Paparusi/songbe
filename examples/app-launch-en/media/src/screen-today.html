<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../../../kit/fonts/fonts.css"><style>
*{margin:0;padding:0;box-sizing:border-box}body{width:550px;height:1191px;background:#F3F8EF;font-family:'Be Vietnam Pro',sans-serif;color:#10261C;overflow:hidden;-webkit-font-smoothing:antialiased}
.top{padding:92px 30px 0}.hi{font-size:17px;font-weight:600;color:#5B6F63}.h1{font-size:34px;font-weight:800;letter-spacing:-1px;margin-top:4px}
.hero{margin:24px 30px 0;border-radius:30px;padding:26px;background:linear-gradient(135deg,#2BB673,#157A4A);color:#fff;position:relative;overflow:hidden;height:186px}
.hero b{display:block;font-size:54px;font-weight:900;letter-spacing:-2px;line-height:1}.hero span{font-size:18px;font-weight:600;opacity:.92}
.hero .bar{position:absolute;left:26px;right:26px;bottom:26px;height:10px;border-radius:5px;background:rgba(255,255,255,.28)}.hero .bar i{display:block;width:38%;height:100%;border-radius:5px;background:#C8F26B}
.hero svg{position:absolute;right:-18px;top:-10px;opacity:.22}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:30px 30px 14px}.sec b{font-size:22px;font-weight:800}.sec span{font-size:15px;font-weight:700;color:#1F9D62}
.row{margin:0 30px 14px;background:#fff;border-radius:26px;padding:16px;display:flex;align-items:center;gap:16px;box-shadow:0 10px 26px rgba(16,38,28,.07)}
.th{width:78px;height:78px;border-radius:22px;display:flex;align-items:center;justify-content:center;flex:none}
.nm{font-size:20px;font-weight:800;letter-spacing:-.3px}.nt{font-size:15px;font-weight:500;color:#5B6F63;margin-top:3px}
.bt{margin-left:auto;font-size:15px;font-weight:800;padding:11px 20px;border-radius:999px;background:#10261C;color:#C8F26B}.bt.d{background:#E7F1E0;color:#5B6F63}
.tab{position:absolute;left:22px;right:22px;bottom:26px;height:76px;border-radius:38px;background:#10261C;display:flex;align-items:center;justify-content:space-around}
.tab i{width:26px;height:26px;border-radius:9px;border:3px solid rgba(255,255,255,.42)}.tab i.on{background:#C8F26B;border-color:#C8F26B}
</style></head><body>
