<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Songbe</title>
<style>
html, body { height: 100%; margin: 0; background: #0D1117; color: #E7ECF2; font: 15px/1.55 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
body { display: grid; place-items: center; user-select: none; }
[hidden] { display: none !important; }
main { text-align: center; max-width: 560px; padding: 24px; }
img { width: 96px; height: 96px; }
h1 { font-size: 30px; font-weight: 800; letter-spacing: -.6px; margin: 18px 0 6px; } h1 span { color: #4FE0D6; }
p { margin: 0; color: #9AA7B6; } p.bad { color: #E7ECF2; }
code { display: block; margin-top: 14px; padding: 10px 12px; border: 1px solid #2A3441; border-radius: 9px; background: #151B23; color: #9AA7B6; font: 12.5px/1.5 ui-monospace, Consolas, monospace; user-select: text; word-break: break-all; }
.dots i { display: inline-block; width: 6px; height: 6px; margin: 16px 3px 0; border-radius: 50%; background: #4FE0D6; opacity: .25; animation: b 1.1s infinite; } .dots i:nth-child(2) { animation-delay: .18s; } .dots i:nth-child(3) { animation-delay: .36s; }
@keyframes b { 30% { opacity: 1; } 60% { opacity: .25; } }
</style></head>
<body><main>
<img src="logo.png" alt="">
<h1>Song<span>be</span></h1>
<p id="msg">Starting…</p><div class="dots" id="dots"><i></i><i></i><i></i></div><code id="log" hidden></code>
</main>
<script>
// The shell returns here with #what=…&log=… when the engine cannot run.
const TEXT = { missing: 'Songbe could not find its engine. Installing it again usually fixes this.', stopped: 'The engine stopped. Close this window and open Songbe again.' };
function show() {
  const q = new URLSearchParams(location.hash.slice(1)), what = q.get('what');
  if (!what) return;
  const msg = document.getElementById('msg'), log = document.getElementById('log');
  msg.textContent = TEXT[what] || 'Something went wrong.'; msg.className = 'bad'; document.getElementById('dots').hidden = true;
  if (q.get('log')) { log.textContent = 'Details: ' + q.get('log'); log.hidden = false; }
}
addEventListener('hashchange', show); show();
</script>
</body></html>
