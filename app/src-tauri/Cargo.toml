[package]
name = "songbe-app"
version = "0.29.0"
description = "Songbe desktop app: a native window around the Songbe studio"
edition = "2021"
license-file = "../../LICENSE"
publish = false

[[bin]]
name = "songbe"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
