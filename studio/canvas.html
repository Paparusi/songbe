<body>
<header class="bar">

<main>
  <section id="board"><div id="world"><svg id="wires"></svg></div><div id="log"></div>

<script>

  if (/prompt|text/.test((K.one || K.must || []).join())) kids.push(el('div', { class: 'hint', text: 'Write @name to bring another node in: a note’s words, a person or place described, or a picture handed to the model as a reference.' }));

  if (r.url) kids.push(el('div', { class: 'out' }, n.kind === 'picture' ? el('img', { src: r.url }) : n.kind === 'clip' || n.kind === 'cut' ? el('video', { src: r.url, controls: true, playsinline: true }) : el('audio', { src: r.url, controls: true })));
  const takes = el('div', { class: 'takes' }); kids.push(takes);
  if (r.state === 'ready' && r.takes > 1) api('/api/takes?id=' + sel).then((x) => x.json()).then((t) => { if (t.takes?.length > 1) takes.replaceChildren(...t.takes.map((k) => el('button', { class: 'btn small' + (k.current ? ' on' : ''), text: 'take ' + k.n, title: `${k.by || ''} ${String(k.at || '').slice(0, 16).replace('T', ' ')}`, onclick: () => post('/api/pick', { id: sel, n: k.n }) }))); });
  const acts = el('div', { class: 'acts' }); kids.push(acts);
  if (K.ext && !n.file) { if (['make', 'wait'].includes(r.state)) acts.append(el('button', { class: 'btn go', text: 'Make it', disabled: S.running, onclick: () => run({ want: [sel] }) })); if (r.state === 'ready') acts.append(el('button', { class: 'btn', text: 'Another take', disabled: S.running, onclick: () => run({ again: [sel] }) }));
    if (r.state === 'ready' || r.state === 'held') acts.append(el('button', { class: 'btn', text: r.held ? 'Let it follow again' : 'Hold this take', onclick: () => post('/api/hold', { id: sel, on: !r.held }) })); }
  acts.append(el('button', { class: 'btn stop', text: 'Delete', onclick: () => api('/api/delete', { method: 'POST', body: JSON.stringify({ id: sel }) }).then((x) => x.json()).then((x) => { if (x.error || x.bad) return say(x.error || x.bad[0], true); sel = null; take(x); draw(); panel(); }) }));
  if (n.by === 'director') kids.push(el('div', { class: 'mark', text: 'Written by the director from the series and the script. Once you change it here it is yours: the director leaves it alone.' }));
  const problems = el('div', { id: 'problems' }); kids.push(problems);
  side.replaceChildren(...kids);
}
function save() {      // a moment after the last keystroke; a canvas that would not be sound is not kept, and the page says why
  $('#saved').hidden = false; $('#saved').textContent = 'saving…'; clearTimeout(saving); const id = sel, node = S.flow.nodes[id];
  saving = setTimeout(async () => {
    const x = await api('/api/node?id=' + encodeURIComponent(id), { method: 'PUT', body: JSON.stringify(node) }).then((r) => r.json()), box = document.getElementById('problems');
    if (x.error || x.saved === false) { $('#saved').textContent = 'not saved'; $('#saved').className = 'tag warn'; if (box && sel === id) box.replaceChildren(...(x.bad || [x.error]).map((b) => el('div', { class: 'msg bad', text: b }))); return; }
    $('#saved').textContent = 'saved'; $('#saved').className = 'tag on'; const typed = S.flow.nodes[id]; take(x); if (sel === id) S.flow.nodes[id] = { ...x.flow.nodes[id], ...typed, by: x.flow.nodes[id].by, as: x.flow.nodes[id].as, of: x.flow.nodes[id].of }; draw(); if (box) box.replaceChildren();
  }, 600);
}
const post = (where, body) => api(where, { method: 'POST', body: JSON.stringify(body) }).then((x) => x.json()).then((x) => { if (x.error) return say(x.error, true); take(x); draw(); panel(); });

// ---- making ----
async function run(what) {
  const x = await api('/api/run', { method: 'POST', body: JSON.stringify(what) }).then((r) => r.json()); if (x.error) return say(x.error, true);
  S.running = true; draw(); panel(); listen();
}
function listen() {
  if (events) events.close(); events = new EventSource(prefix + '/api/events');
  events.onmessage = async (m) => { const e = JSON.parse(m.data);
    if (e.type === 'start') { busy.add(e.id); failed.delete(e.id); say(`${e.id}: ${e.by}`); } else if (e.type === 'done') busy.delete(e.id); else if (e.type === 'failed') { busy.delete(e.id); failed.set(e.id, e.error); say(`${e.id}: ${e.error}`, true); } else if (e.type === 'line') say(e.text, /^songbe:/.test(e.text));
    if (e.type === 'end') { events.close(); events = null; busy.clear(); }
    if (['done', 'failed', 'end'].includes(e.type)) { take(await api('/api/state').then((r) => r.json())); panel(); }
    draw(); };
  events.onerror = () => { events?.close(); events = null; };
}

// ---- hands: move the view, move a card, choose a card ----
let drag = null;
board.addEventListener('pointerdown', (e) => {
  if (e.target.closest('#zoom')) return;
  const node = e.target.closest('.node'), id = node?.dataset.id;
  drag = node && e.target.closest('.nh') ? { id, x: e.clientX, y: e.clientY, at: [...place(id)], moved: false } : { pan: true, id, x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false };
  board.setPointerCapture(e.pointerId);
});
board.addEventListener('pointermove', (e) => {
  if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true; if (!drag.moved) return;
  if (drag.pan) { view.x = drag.vx + dx; view.y = drag.vy + dy; board.classList.add('panning'); world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`; }
  else { S.flow.nodes[drag.id].xy = [Math.round(drag.at[0] + dx / view.k), Math.round(drag.at[1] + dy / view.k)]; draw(); }
});
board.addEventListener('pointerup', () => {
  const d = drag; drag = null; board.classList.remove('panning'); if (!d) return;
  if (!d.moved) { sel = d.id || null; draw(); panel(); return; }
  if (!d.pan) api('/api/place', { method: 'POST', body: JSON.stringify({ [d.id]: S.flow.nodes[d.id].xy }) });
});
board.addEventListener('wheel', (e) => { e.preventDefault(); const r = board.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top, k = Math.min(2.5, Math.max(.08, view.k * (e.deltaY < 0 ? 1.12 : 1 / 1.12)));
  view.x = mx - (mx - view.x) * (k / view.k); view.y = my - (my - view.y) * (k / view.k); view.k = k; world.style.transform = `translate(${view.x}px,${view.y}px) scale(${k})`; }, { passive: false });
$('#zoom').addEventListener('click', (e) => { const z = e.target.dataset.z; if (!z) return; if (z === 'fit') return fit(); const k = Math.min(2.5, Math.max(.08, view.k * (z === 'in' ? 1.25 : .8))), cx = board.clientWidth / 2, cy = board.clientHeight / 2; view.x = cx - (cx - view.x) * (k / view.k); view.y = cy - (cy - view.y) * (k / view.k); view.k = k; draw(); });
$('#go').addEventListener('click', () => run({})); $('#stop').addEventListener('click', () => api('/api/stop', { method: 'POST', body: '{}' }));

// ---- a new node ----
const FIRST = { text: () => ({ text: 'Write here.' }), person: (name) => ({ name }), place: (name) => ({ name }), picture: () => ({ prompt: 'Describe the picture.' }), voice: () => ({ text: 'The line.' }), clip: () => ({ prompt: 'Describe what happens.' }), music: () => ({ prompt: 'Instrumental, no vocals.' }) };
$('#addb').addEventListener('click', () => {
  const menu = $('#menu'); if (!menu.hidden) return (menu.hidden = true);
  let kind = 'picture'; const name = el('input', { type: 'text', placeholder: 'its name, like rain-on-glass' }), kinds = el('div', { class: 'kinds' }), msg = el('div', { class: 'msg bad' });
  const paint = () => kinds.replaceChildren(...Object.keys(FIRST).map((k) => el('button', { class: 'btn small' + (k === kind ? ' on' : ''), text: k, onclick: () => { kind = k; paint(); } })));
  const add = async () => { const id = name.value.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); if (!id) return (msg.textContent = 'Give it a name.'); if (S.flow.nodes[id]) return (msg.textContent = 'That name is taken.');
    const xy = [Math.round((board.clientWidth / 2 - view.x) / view.k - 95), Math.round((board.clientHeight / 2 - view.y) / view.k - 80)];
    const x = await api('/api/node?id=' + id, { method: 'PUT', body: JSON.stringify({ kind, ...FIRST[kind](name.value.trim()), xy }) }).then((r) => r.json()); if (x.error || x.saved === false) return (msg.textContent = x.error || x.bad[0]);
    menu.hidden = true; take(x); sel = id; draw(); panel(); };
  paint(); menu.replaceChildren(kinds, name, el('div', { class: 'acts' }, el('button', { class: 'btn go', text: 'Add', onclick: add })), msg); menu.hidden = false; name.focus(); name.addEventListener('keydown', (e) => { if (e.key === 'Enter') add(); });
});

window.ready = api('/api/state').then((r) => r.json()).then((x) => { take(x); fit(); panel(); if (S.running) listen(); return Object.keys(S.flow.nodes).length; });
</script>
